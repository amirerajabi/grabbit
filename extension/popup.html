<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <style>
      :root { color-scheme: light dark; --bg: #ffffff; --fg: #1c1f24; --muted: #5f6673; --ok: #15803d; --bad: #b91c1c; --accent: #2563eb; }
      @media (prefers-color-scheme: dark) { :root { --bg: #24272d; --fg: #e6e8eb; --muted: #9aa1ab; --ok: #4ade80; --bad: #f87171; --accent: #5b9cff; } }
      body { margin: 0; width: 260px; padding: 14px; background: var(--bg); color: var(--fg); font: 13px 'Segoe UI', system-ui, sans-serif; }
      header { display: flex; align-items: center; gap: 8px; font-weight: 600; font-size: 15px; }
      header img { width: 20px; height: 20px; }
      p { margin: 10px 0; color: var(--muted); }
      .ok { color: var(--ok); }
      .bad { color: var(--bad); }
      label { display: flex; align-items: center; gap: 8px; cursor: pointer; }
      input { accent-color: var(--accent); }
    </style>
  </head>
  <body>
    <header><img src="icon.png" alt="" />Grabbit</header>
    <p id="status">Checking…</p>
    <label><input type="checkbox" id="capture" /> Capture downloads from this browser</label>
    <script src="popup.js"></script>
  </body>
</html>
