name: Publish extensions

# When a GitHub Release is published (release.yml), send that version of the browser extension to the Chrome Web Store,
# Firefox Add-ons and Edge Add-ons. A store without its secrets is skipped. The first version of each listing is
# submitted by hand (store/README.md); this workflow publishes every version after that.
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to publish, e.g. v1.0.3
        required: true
      stores:
        description: Stores to publish to (space-separated chrome firefox edge; empty = all set up)
        required: false
        default: ''

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.event.release.tag_name }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Build extensions
        run: node scripts/build-extensions.mjs
      - name: Publish
        env:
          CWS_EXTENSION_ID: ${{ secrets.CWS_EXTENSION_ID }}
          CWS_CLIENT_ID: ${{ secrets.CWS_CLIENT_ID }}
          CWS_CLIENT_SECRET: ${{ secrets.CWS_CLIENT_SECRET }}
          CWS_REFRESH_TOKEN: ${{ secrets.CWS_REFRESH_TOKEN }}
          AMO_JWT_ISSUER: ${{ secrets.AMO_JWT_ISSUER }}
          AMO_JWT_SECRET: ${{ secrets.AMO_JWT_SECRET }}
          EDGE_PRODUCT_ID: ${{ secrets.EDGE_PRODUCT_ID }}
          EDGE_CLIENT_ID: ${{ secrets.EDGE_CLIENT_ID }}
          EDGE_API_KEY: ${{ secrets.EDGE_API_KEY }}
        run: node scripts/publish-extensions.mjs ${{ github.event.inputs.stores }}
