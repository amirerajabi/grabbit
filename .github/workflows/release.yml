name: Release

# Push a tag like v1.0.0 (matching desktop/package.json) to build the Windows installer, the macOS DMG/ZIP and the Linux
# AppImage on their native runners and publish them as a GitHub Release with docs/release-notes/<tag>.md.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to (re)publish, e.g. v1.0.0
        required: true

permissions:
  contents: write

env:
  CSC_IDENTITY_AUTO_DISCOVERY: 'false'
  TAG: ${{ github.event.inputs.tag || github.ref_name }}

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows installer
            os: windows-latest
            target: --win nsis --x64
            artifact: release-windows
          - name: macOS DMG (Apple silicon)
            os: macos-latest
            target: --mac dmg zip --arm64
            artifact: release-macos
          - name: Linux AppImage
            os: ubuntu-latest
            target: --linux AppImage --x64
            artifact: release-linux
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            engine/package-lock.json
            ui/package-lock.json
            desktop/package-lock.json
      - name: Check tag matches desktop/package.json
        shell: bash
        run: |
          v=$(node -p "require('./desktop/package.json').version")
          if [ "v$v" != "$TAG" ]; then echo "Tag $TAG does not match desktop/package.json ($v)"; exit 1; fi
      - name: Install
        run: |
          npm ci --prefix engine
          npm ci --prefix ui
          npm ci --prefix desktop
      - name: Build engine, UI and desktop shell
        run: npm run build
      - name: Package
        working-directory: desktop
        run: npx electron-builder ${{ matrix.target }} --publish never
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          # latest*.yml + .blockmap files: what the in-app updater reads from the release.
          path: |
            desktop/release/*.exe
            desktop/release/*.dmg
            desktop/release/*.zip
            desktop/release/*.AppImage
            desktop/release/*.blockmap
            desktop/release/latest*.yml
          if-no-files-found: error

  publish:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - run: ls -la artifacts
      # Every platform must ship its update metadata, or installed copies on it never see this release.
      - name: Check update metadata
        run: |
          for f in latest.yml latest-mac.yml latest-linux.yml; do
            test -f "artifacts/$f" || { echo "missing $f"; exit 1; }
            grep -q "^version: ${TAG#v}$" "artifacts/$f" || { echo "$f is not version ${TAG#v}"; exit 1; }
            for asset in $(grep -E '^\s+- url: ' "artifacts/$f" | awk '{print $3}'); do
              test -f "artifacts/$asset" || { echo "$f names $asset, which is not in the release"; exit 1; }
            done
          done
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG }}
          name: Grabbit ${{ env.TAG }}
          body_path: docs/release-notes/${{ env.TAG }}.md
          files: artifacts/*
          fail_on_unmatched_files: true
